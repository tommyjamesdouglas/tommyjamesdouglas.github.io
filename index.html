/* Palette TJD per valore: fonte STANDARDS.md / identita-visiva.md */
:root{
  --arancione:#f76232;
  --nero-caldo:#1c1c1c;
  --crema:#e7dcc8;
  --off-white:#fafaf8;
  --verde-militare:#586044;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--nero-caldo);overflow-x:hidden;-webkit-text-size-adjust:100%}
body{
  color:var(--off-white);
  font-family:"Poppins",system-ui,sans-serif;
  min-height:100vh;
  display:flex;justify-content:center;
  padding:48px 20px 40px;
  -webkit-font-smoothing:antialiased;
}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}
.testa{width:120px;height:auto;margin-bottom:20px}
.nome{font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--off-white);opacity:.85}
.frase{
  font-family:"PP Editorial New",Georgia,serif;font-style:italic;
  font-size:23px;line-height:1.3;margin:22px 0 36px;max-width:360px;
}
.frase em{font-style:italic}

.giorno-zero{
  width:100%;background:transparent;color:var(--off-white);
  border:1.5px solid var(--crema);border-radius:14px;padding:26px 16px 14px;
}
.giorno-zero h1{font-family:"PP Editorial New",Georgia,serif;font-weight:400;font-size:34px;line-height:1}
.giorno-zero p{font-size:14px;line-height:1.5;margin:12px auto 16px;max-width:320px}
.giorno-zero iframe{width:100%;height:130px;border:0;background:transparent;color-scheme:dark}

.articoli{width:100%;margin-top:34px}
.articoli h2{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin-bottom:14px}
.pulsante{
  display:block;width:100%;text-decoration:none;
  border:1.5px solid var(--crema);color:var(--off-white);
  border-radius:12px;padding:16px 18px;margin-bottom:12px;
  font-size:15px;line-height:1.35;transition:background .15s,color .15s;
}
.pulsante span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.pulsante strong{font-family:"PP Editorial New",Georgia,serif;font-style:italic;font-weight:400;font-size:20px}
.pulsante:hover,.pulsante:active{background:var(--crema);color:var(--nero-caldo)}

footer{margin-top:40px;font-size:11px;opacity:.4}
</style>

<script>
/* =========================================================
   SI AGGIORNA SOLO QUI (regole in officina/link-in-bio.md)
   ========================================================= */
const PUBBLICAZIONE = "https://giornozero.substack.com";

// Prima del 30/10: testo di attesa. Dopo il lancio: testo normale.
const TESTO_PRIMA_DEL_LANCIO = "Il primo articolo esce venerdì 30 ottobre. Lascia la mail e ti arriva appena esce.";
const TESTO_DOPO_IL_LANCIO   = "Qui trovi gli articoli completi dei pezzi che pubblico. Lascia la mail e ti arrivano appena escono.";
const DATA_LANCIO = "2026-10-30";

// Massimo 2 articoli, il più recente in cima. Esempio:
// { titolo: "La candela", ciclo: "essere-il-migliore-non-conta", variante: "pagina", pezzo: "la-candela", url: PUBBLICAZIONE + "/p/slug-articolo" },
const ARTICOLI = [
];
/* ========================================================= */

const utm = (content, campaign) =>
  "utm_source=instagram&utm_medium=linkinbio" +
  (campaign ? "&utm_campaign=" + campaign : "") +
  "&utm_content=" + content;

const lanciato = new Date() >= new Date(DATA_LANCIO + "T00:00:00+01:00");
document.getElementById("gz-testo").textContent = lanciato ? TESTO_DOPO_IL_LANCIO : TESTO_PRIMA_DEL_LANCIO;
document.getElementById("gz-form").src = PUBBLICAZIONE + "/embed";

if (ARTICOLI.length) {
  const lista = document.getElementById("lista");
  ARTICOLI.slice(0, 2).forEach(a => {
    const el = document.createElement("a");
    el.className = "pulsante";
    el.href = a.url + (a.url.includes("?") ? "&" : "?") + utm(a.variante + "-" + a.pezzo, a.ciclo);
    el.innerHTML = "<span>Leggi l'articolo</span><strong></strong>";
    el.querySelector("strong").textContent = a.titolo;
    lista.appendChild(el);
  });
  const sez = document.getElementById("articoli");
  sez.hidden = false;
  // chi arriva da un post cerca l'articolo: gli articoli vanno sopra il box di iscrizione
  document.querySelector(".giorno-zero").before(sez);
  sez.style.margin = "0 0 30px";
}
</script>
